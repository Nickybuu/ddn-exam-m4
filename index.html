:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2a30;--mute:#5d6b70;--line:#dbe2df;--acc:#1f6f78;--accs:#e3f1f2;--ok:#2e7d4f;--oks:#e5f3ea;--bad:#b3452c;--bads:#fbe8e2;--warn:#a86400;--warns:#fff1d6;color-scheme:light}
*{box-sizing:border-box;font-feature-settings:"locl" 0,"tnum" 0,"lnum" 1}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DDNSarabun',Tahoma,sans-serif;font-size:20px;line-height:1.45}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.danger{color:var(--bad);border-color:var(--bads)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);max-width:100%}
textarea{width:100%;min-height:150px;font-size:17px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{width:54px;height:54px;object-fit:contain}.top h1{font-size:24px;margin:0;line-height:1.2}.top .sub{font-size:16px;color:var(--mute)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.steps button{border-radius:999px;padding:4px 14px;font-size:18px}.steps button[aria-current=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.sync{font-size:15px;border-radius:999px;padding:0 10px;white-space:nowrap;display:none;margin-left:6px;vertical-align:middle}
.sync.on{display:inline-block}.sync.busy{background:var(--accs);color:var(--acc)}.sync.ok{background:var(--oks);color:var(--ok)}.sync.bad{background:var(--bads);color:var(--bad)}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card h2{font-size:22px;margin:0}.card h3{font-size:19px;margin:4px 0 0}.muted{color:var(--mute);font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.stat b{font-size:28px;display:block;line-height:1.2}.stat span{font-size:16px;color:var(--mute)}
.stat.ok{background:var(--oks);border-color:#bfe0cb}.stat.warn{background:var(--warns);border-color:#f0d49a}.stat.bad{background:var(--bads);border-color:#efc2b6}
.hint{border-radius:10px;padding:10px 14px;background:var(--accs);font-size:18px}.hint.warn{background:var(--warns)}.hint.bad{background:var(--bads);color:var(--bad)}.hint.ok{background:var(--oks);color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fil{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.fil button{border-radius:999px;padding:2px 12px;font-size:16px}.fil button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fil button small{opacity:.75}
.gtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.gtabs button{display:grid;gap:0;text-align:center;padding:8px 10px;border-radius:12px}.gtabs button b{font-size:19px}.gtabs button span{font-size:15px;color:var(--mute)}
.gtabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.gtabs button[aria-pressed=true] span{color:#fff;opacity:.85}
.list{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.it{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);text-align:left;border-radius:0;border-left:0;border-right:0;border-bottom:0;background:var(--card);width:100%}
.it:first-child{border-top:0}button.it:hover{background:#f8faf9}
.it .no{color:var(--mute);font-size:16px;text-align:center}.it .no b{display:block;font-size:22px;color:var(--ink)}
.it .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .nm span{font-size:15px;color:var(--mute);display:block}
.it .st{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;font-size:16px}
.it.abs{background:var(--bads)}.it.hl{outline:3px solid var(--acc);outline-offset:-3px}.dfind{position:sticky;top:76px;z-index:4;padding:10px 12px}@media (max-width:760px){.dfind{top:0}}.it.dim{opacity:.6}
.badge{border-radius:6px;padding:0 8px;font-size:15px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--oks);color:var(--ok)}.b-bad{background:var(--bads);color:var(--bad)}.b-warn{background:var(--warns);color:var(--warn)}.b-mute{background:#e4e7ea;color:#4a5560}.b-acc{background:var(--accs);color:var(--acc)}
.tog{min-width:92px;font-weight:700}.tog.on{background:var(--bad);border-color:var(--bad);color:#fff}
table{border-collapse:collapse;width:100%;font-size:17px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}
.empty{padding:20px;text-align:center;color:var(--mute)}
.spin{width:22px;height:22px;border:3px solid var(--accs);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:18px;max-width:min(92vw,720px);display:none;z-index:60;white-space:pre-line}
#toast.bad{background:var(--bad)}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,96vw);box-shadow:0 12px 40px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(0,0,0,.25)}
.dl{padding:16px 18px;display:grid;gap:12px}.dl h3{margin:0;font-size:24px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fgrid label{display:grid;gap:2px;font-size:16px;color:var(--mute)}.fgrid label input,.fgrid label select{color:var(--ink);font-size:18px;width:100%}

.stp .i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#e4e7ea;color:#4a5560;font-size:16px}.stp.ok .i{background:var(--oks);color:var(--ok)}.stp.todo .i{background:var(--warns);color:var(--warn)}.stp.bad .i{background:var(--bads);color:var(--bad)}

.sess{border-radius:999px;padding:2px 14px;font-weight:700}.sess.am{background:#fff1d6;color:#8a5200}.sess.pm{background:#e3ecfb;color:#24508f}

.hide{display:none!important}

function dFit(root) {

/** ความกว้างโดยประมาณ (มม.) ของข้อความที่ 15pt — ใช้ขยายคอลัมน์ที่ข้อความยาวผิดปกติ (เช่น ชื่อห้องเป็นคำ) */
function txtMm(t) { return String(t || '').replace(/[\u0e31\u0e34-\u0e3a\u0e47-\u0e4e]/g, '').length * 2.05; }
/** ส่วนล่างสุดของเนื้อหาในหน้า (มม. จากขอบบนกระดาษ) */
function pgBottom(pg) {
  var r = pg.getBoundingClientRect(), mm = r.height / 297, b = 0;
  [].slice.call(pg.querySelectorAll('*')).forEach(function (e) { if (e.closest('.pn,.sgn')) return; var x = e.getBoundingClientRect(); if (x.height) b = Math.max(b, (x.bottom - r.top) / mm); });   // ท้ายกระดาษอยู่ในขอบล่างอยู่แล้ว
  return b;
}
/** ไม่ให้เนื้อหาล้นหน้ากระดาษ: หน้าใดยาวเกิน (ชื่อประเภท/ห้องยาวจนขึ้นบรรทัดใหม่ · กรรมการ 3 คน · ห้องใหญ่) → ลดความสูงแถวตารางจนพอดี */
var PG_MAX = 285;   // ขอบล่างที่ปลอดภัย 12 มม. (เครื่องพิมพ์ส่วนใหญ่พิมพ์ไม่ถึงขอบกระดาษ)
function fitRows(root) {
  var over = 0, steps = ['', 'dense', 'dense2 tight'];   // ลดความสูงแถว → ตัวอักษรตารางเล็กลง → บีบช่องว่างท้ายกระดาษ
  [].slice.call(root.querySelectorAll('.pg')).forEach(function (pg) {
    for (var lv = 0; lv < steps.length; lv++) {
      if (steps[lv]) steps[lv].split(' ').forEach(function (c) { pg.classList.add(c); });
      for (var k = 0; k < 4; k++) {
        var ex = pgBottom(pg) - PG_MAX;
        if (ex <= 0) return;
        var trs = [].slice.call(pg.querySelectorAll('table.fitrows tbody tr'));
        if (!trs.length) break;
        var h = trs[0].getBoundingClientRect().height / (pg.getBoundingClientRect().height / 297), nh = Math.max(4.4, h - ex / trs.length - 0.08);
        if (nh >= h - 0.01) break;
        trs.forEach(function (tr) { tr.style.height = nh.toFixed(2) + 'mm'; });
      }
    }
    if (pgBottom(pg) > PG_MAX) over++;
  });
  return over;
}
function docFit() { var p = $('pgs'); dFit(p); return fitRows(p); }
